# Local run of the same image the cloud would run:
#   docker compose -f deploy/docker-compose.yml up --build
# then open http://localhost:8000 and enter your DEMO_ACCESS_CODE.
services:
  skillbridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
