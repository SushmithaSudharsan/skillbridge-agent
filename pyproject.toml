[project]
name = "skillbridge"
version = "1.0.0"
description = "Honest resume-to-job gap analysis: grounded LLM reading, code-verified claims, privacy by design."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pypdf>=4.0,<6",
    "python-docx>=1.1,<2",
    "reportlab>=4.0,<5",
]

[project.optional-dependencies]
llm = ["langchain>=1.0,<2", "langchain-google-genai>=2.0", "python-dotenv>=1.0,<2"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "backend/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]   # long prompt lines; FastAPI's Depends() defaults

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
