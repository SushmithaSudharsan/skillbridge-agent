# Evaluation gate with a real LLM. Runs when prompts or analysis code change, or on demand.
# Needs repository secrets GOOGLE_API_KEY and SKILLBRIDGE_MODEL. Costs a few cents per run.
name: evals
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "prompts/**"
      - "backend/app/services/**"
      - "evals/**"
jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      SKILLBRIDGE_MODEL: ${{ secrets.SKILLBRIDGE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[llm]"
      - name: Skip when no API key is configured
        if: env.GOOGLE_API_KEY == ''
        run: echo "No GOOGLE_API_KEY secret; skipping the real-LLM evaluation."
      - name: Benchmark gate (precision, recall, cost per analysis)
        if: env.GOOGLE_API_KEY != ''
        run: python evals/runners/run_benchmark.py --runs 1 --limit 5 --min-precision 0.6 --min-recall 0.5 --max-cost 0.02
        env:
          PYTHONPATH: backend
      - name: Style fairness (same facts, different writing)
        if: env.GOOGLE_API_KEY != ''
        run: python evals/runners/run_fairness.py --runs 1 --min-jaccard 0.6
        env:
          PYTHONPATH: backend
