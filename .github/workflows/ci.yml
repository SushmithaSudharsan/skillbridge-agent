# Runs on every push and pull request. No API key needed: tests use a scripted fake LLM.
name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,web,llm]"
      - name: Lint
        run: ruff check backend evals
      - name: Type check
        run: mypy backend/app
      - name: Tests (including fairness and API tests)
        run: pytest -q
      - name: Docker image builds
        run: docker build -f deploy/Dockerfile -t skillbridge:ci .
